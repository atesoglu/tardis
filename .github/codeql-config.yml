name: "Tardis CodeQL Configuration"
disable-default-queries: false

queries:
  # Use the recommended security and quality queries
  - uses: security-extended
  - uses: security-and-quality

# Custom queries (optional)
# - uses: ./my-custom-query.ql

paths-ignore:
  - "**/tests/**"
  - "**/Test/**"
  - "**/*.Tests.cs"
  - "**/obj/**"
  - "**/bin/**"
  - "**/node_modules/**"
  - "**/.git/**"
  - "src/Dashboard/**"
  - "**/Migrations/**"
  - "**/*.Designer.cs"
  - "**/*.g.cs"

# Additional configuration
# paths:
#   - "src"