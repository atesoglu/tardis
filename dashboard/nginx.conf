server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  location / {
    try_files $uri $uri/ /index.html;
  }
  # Proxy API and BFF routes to gateway
  location /bff/ { proxy_pass http://gateway:5000; }
  location /api/ { proxy_pass http://gateway:5000; }
  location /health { proxy_pass http://gateway:5000; }
}