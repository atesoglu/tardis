services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: tardis-postgres
    environment:
      POSTGRES_USER: tardis
      POSTGRES_PASSWORD: tardis
      POSTGRES_DB: tardis
    ports:
      - "5432:5432"
    volumes:
      - ../database/migrations:/docker-entrypoint-initdb.d:Z
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tardis -d tardis"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gateway:
    build:
      context: ../backend
      dockerfile: src/Gateway/Containerfile
    container_name: tardis-gateway
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - AzureAd__Instance=https://login.microsoftonline.com/
      - AzureAd__TenantId=00000000-0000-0000-0000-000000000000
      - AzureAd__Audience=api://tardis
    restart: unless-stopped

  platform:
    build:
      context: ../backend
      dockerfile: src/Platform/Containerfile
    container_name: tardis-platform
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres;Database=tardis;Username=tardis;Password=tardis
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  workers:
    build:
      context: ../backend
      dockerfile: src/Workers/Containerfile
    container_name: tardis-workers
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres;Database=tardis;Username=tardis;Password=tardis
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Containerfile
      args:
        VITE_AZURE_AD_CLIENT_ID: ${VITE_AZURE_AD_CLIENT_ID:-}
        VITE_AZURE_AD_TENANT_ID: ${VITE_AZURE_AD_TENANT_ID:-}
        VITE_REDIRECT_URI: ${VITE_REDIRECT_URI:-http://localhost:3000}
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:5000}
    container_name: tardis-dashboard
    ports:
      - "3000:8080"
    environment:
      - VITE_API_BASE=
    restart: unless-stopped

  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:latest
    container_name: tardis-otel
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel-config.yaml:/etc/otel-collector-config.yaml:Z
    command: ["--config=/etc/otel-collector-config.yaml"]

volumes:
  postgres-data: